<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160" role="img" aria-labelledby="title desc">
<title id="title">BLANK 서비스 아키텍처</title>
<desc id="desc">Vue Nuxt SSR 프론트가 API 프록시를 통해 Spring 백엔드에 연결됩니다. 백엔드는 MySQL로 기록을 관리하고 PaddleOCR 또는 Google Vision, Groq Qwen 모델로 원두 정보를 정리합니다. 취향 공간은 별도 OpenRouter 임베딩을 사용합니다. AI 결과는 사용자가 확인한 뒤 저장합니다.</desc>
<defs>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L8,4.5 L0,9" fill="none" stroke="#9c826c" stroke-width="1.5"/></marker>
<style>
text{font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;fill:#332b25}
.title{font-size:36px;font-weight:700;letter-spacing:-1px}
.subtitle{font-size:20px;fill:#7b6d62}
.section{font-size:23px;font-weight:700}
.label{font-size:22px;font-weight:700}
.body{font-size:18px;fill:#796c60}
.small{font-size:16px;fill:#8a7a6b}
.line{fill:none;stroke:#9c826c;stroke-width:2;marker-end:url(#arrow)}
</style>
</defs>
<rect width="1600" height="1160" fill="#f8f5ef"/>
<rect x="40" y="40" width="7" height="67" rx="3.5" fill="#805038"/>
<text x="65" y="72" class="title">BLANK · 서비스 아키텍처</text>
<text x="65" y="107" class="subtitle">사진 입력은 가볍게, 기록은 정확하게 — AI가 만든 초안을 사용자가 확인하고 저장합니다.</text>

<rect x="40" y="160" width="300" height="690" rx="22" fill="#f0ebe3" stroke="#e6ddd0"/>
<text x="64" y="204" class="section">01  프론트엔드</text>
<text x="64" y="231" class="small">사용자 입력과 시각화</text>
<rect x="380" y="160" width="740" height="690" rx="22" fill="#f0ebe3" stroke="#e6ddd0"/>
<text x="404" y="204" class="section">02  백엔드</text>
<text x="404" y="231" class="small">Spring Boot · 도메인별 계층 구조</text>
<rect x="1160" y="160" width="400" height="690" rx="22" fill="#f0ebe3" stroke="#e6ddd0"/>
<text x="1184" y="204" class="section">03  외부 AI 서비스</text>
<text x="1184" y="231" class="small">기능별 모델과 인증 분리</text>
<rect x="62" y="265" width="256" height="105" rx="16" fill="#fff" stroke="#e1d9cf"/>
<text x="83" y="297" class="label">사용자 · 브라우저</text>
<text x="83" y="326" class="body">사진 / 원두 / 브루잉</text>
<text x="83" y="351" class="body">카페 경험 / 지도 / 3D</text>
<rect x="62" y="414" width="256" height="118" rx="16" fill="#fff" stroke="#e1d9cf"/>
<text x="83" y="446" class="label">Vue 3 · Nuxt SSR</text>
<text x="83" y="475" class="body">반응형 컴포넌트</text>
<text x="83" y="500" class="body">동일 출처 API 프록시</text>
<text x="83" y="525" class="body">세션 전달 · CSRF 토큰</text>
<rect x="62" y="578" width="256" height="112" rx="16" fill="#fff" stroke="#e1d9cf"/>
<text x="83" y="610" class="label">상태를 보여주는 UI</text>
<text x="83" y="639" class="body">OCR · LLM 진행 단계</text>
<text x="83" y="664" class="body">후보값 확인과 직접 수정</text>
<text x="62" y="748" class="body">초기 HTML은 SSR</text>
<text x="62" y="777" class="small">지도·3D는 브라우저에서 실행</text>
<text x="62" y="811" class="small">Groq 키는 백엔드에 보관</text>
<rect x="412" y="265" width="304" height="105" rx="16" fill="#fff" stroke="#e1d9cf"/>
