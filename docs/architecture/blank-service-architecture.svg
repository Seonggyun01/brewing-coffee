<text x="785" y="664" class="body">임베딩 → PCA → 3D 좌표</text>
<rect x="412" y="735" width="676" height="83" rx="16" fill="#fff" stroke="#acb5a3"/>
<text x="435" y="768" class="label">Repository · MySQL</text>
<text x="435" y="796" class="body">사용자 · 원두 · 브루잉 · 장소 · 향미 색상 · 취향 좌표</text>
<rect x="1184" y="265" width="352" height="105" rx="16" fill="#fff" stroke="#e1d9cf"/>
<text x="1205" y="297" class="label">OCR · 글자 읽기</text>
<text x="1205" y="326" class="body">PaddleOCR / Google Vision</text>
<text x="1205" y="351" class="body">이미지 → OCR 텍스트</text>
<rect x="1184" y="414" width="352" height="118" rx="16" fill="#fff" stroke="#805038"/>
<rect x="1184" y="432" width="4" height="82" rx="2" fill="#805038"/>
<text x="1205" y="446" class="label">Groq · 원두 정보 정리</text>
<text x="1205" y="475" class="body">Qwen 3.8 27B</text>
<text x="1205" y="500" class="body">추론 끄기 · JSON 응답</text>
<text x="1205" y="525" class="body">최대 출력 768토큰</text>
<rect x="1184" y="578" width="352" height="112" rx="16" fill="#fff" stroke="#e1d9cf"/>
<text x="1205" y="610" class="label">OpenRouter · 임베딩</text>
<text x="1205" y="639" class="body">Nemotron 3 Embed 1B</text>
<text x="1205" y="664" class="body">취향 기록 → 벡터</text>
<rect x="1184" y="730" width="352" height="88" rx="16" fill="#f8f5ef" stroke="#e1d9cf" stroke-dasharray="6 5"/>
<text x="1204" y="761" class="label">향미 색상 추천 · 별도 경로</text>
<text x="1204" y="791" class="small">Groq · 일괄 요청 / 향미 수별 출력 상한</text>
