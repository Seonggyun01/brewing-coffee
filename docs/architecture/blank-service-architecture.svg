<text x="433" y="351" class="body">카카오 OAuth2 · 세션</text>
<rect x="412" y="414" width="304" height="118" rx="16" fill="#fff" stroke="#e1d9cf"/>
<text x="433" y="446" class="label">도메인 서비스</text>
<text x="433" y="475" class="body">원두 / 브루잉 / 카페 기록</text>
<text x="433" y="500" class="body">소유자 확인 · 입력 검증</text>
<text x="433" y="525" class="body">재고 차감·복원 · 트랜잭션</text>
<rect x="764" y="265" width="324" height="267" rx="16" fill="#fff" stroke="#805038"/>
<rect x="764" y="283" width="4" height="231" rx="2" fill="#805038"/>
<text x="785" y="297" class="label">원두 사진 분석</text>
<text x="785" y="326" class="body">이미지 검증 · 형식 변환</text>
<text x="785" y="351" class="body">OCR 원문 추출</text>
<text x="785" y="376" class="body">Groq JSON 구조화</text>
<text x="785" y="401" class="body">필드 검증 · 향미 정규화</text>
<text x="785" y="426" class="body">수정 가능한 후보 폼 반환</text>
<text x="785" y="509" class="small">※ 이 단계에서는 DB에 저장하지 않음</text>
<rect x="764" y="578" width="324" height="112" rx="16" fill="#fff" stroke="#e1d9cf"/>
