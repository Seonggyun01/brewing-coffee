spring:
  application:
    name: blank

  config:
    import: optional:classpath:application-local.yml

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:brewlog}?useUnicode=true&characterEncoding=utf8&serverTimezone=${DB_TIMEZONE:Asia/Seoul}&allowPublicKeyRetrieval=true&useSSL=false
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:brewlog}
    password: ${DB_PASSWORD:brewlog}

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_REST_API_KEY:${brewlog.kakao.rest-api-key:}}
            client-secret: ${KAKAO_CLIENT_SECRET:${brewlog.kakao.KAKAO_CLIENT_SECRET:}}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

server:
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: ${BREWLOG_SESSION_TIMEOUT:1d}
      cookie:
        max-age: ${BREWLOG_SESSION_COOKIE_MAX_AGE:1d}

logging:
  level:
    org.hibernate.SQL: debug

brewlog:
  api-usage:
    file: ${BREWLOG_API_USAGE_FILE:../logs/api-usage.jsonl}
    groq-daily-tokens: ${BREWLOG_GROQ_DAILY_TOKENS:200000}
    openrouter-daily-requests: ${BREWLOG_OPENROUTER_DAILY_REQUESTS:50}
    vision-monthly-units: ${BREWLOG_VISION_MONTHLY_UNITS:1000}
    max-concurrent-requests: ${BREWLOG_AI_MAX_CONCURRENT_REQUESTS:2}
  dummy-data:
    enabled: ${BREWLOG_DUMMY_DATA_ENABLED:false}
  taste-space:
    backfill-enabled: ${BREWLOG_TASTE_SPACE_BACKFILL_ENABLED:false}
  ocr:
    provider: ${BREWLOG_OCR_PROVIDER:local-best}
    google-credentials-path: ${BREWLOG_GOOGLE_CREDENTIALS_PATH:}
    paddle:
      python-executable: ${BREWLOG_PADDLE_OCR_PYTHON:auto}
      script-path: ${BREWLOG_PADDLE_OCR_SCRIPT:scripts/paddle_ocr.py}
      cache-directory: ${BREWLOG_PADDLE_OCR_CACHE:${user.home}}
      timeout-seconds: ${BREWLOG_PADDLE_OCR_TIMEOUT_SECONDS:90}
      minimum-text-length: ${BREWLOG_PADDLE_OCR_MIN_TEXT_LENGTH:20}
      fallback-enabled: ${BREWLOG_PADDLE_OCR_FALLBACK_ENABLED:true}
      max-input-side: ${BREWLOG_PADDLE_OCR_MAX_INPUT_SIDE:1216}
      language: ${BREWLOG_PADDLE_OCR_LANG:korean}
      detection-model: ${BREWLOG_PADDLE_OCR_DETECTION_MODEL:PP-OCRv5_server_det}
      recognition-model: ${BREWLOG_PADDLE_OCR_RECOGNITION_MODEL:korean_PP-OCRv5_mobile_rec}
  kakao:
    javascript-key: ${BREWLOG_KAKAO_JAVASCRIPT_KEY:}
    rest-api-key: ${KAKAO_REST_API_KEY:}
    client-secret: ${KAKAO_CLIENT_SECRET:}
  llm:
    provider: ${BREWLOG_LLM_PROVIDER:ollama}
    groq:
      api-key: ${GROQ_API_KEY:}
      model-url: ${BREWLOG_GROQ_MODEL_URL:https://api.groq.com/openai/v1/chat/completions}
      model-id: ${BREWLOG_GROQ_MODEL_ID:qwen/qwen3.8-27b}
      timeout-seconds: ${BREWLOG_GROQ_TIMEOUT_SECONDS:60}
      max-tokens: ${BREWLOG_GROQ_MAX_TOKENS:768}
      temperature: ${BREWLOG_GROQ_TEMPERATURE:0.0}
    openrouter:
      api-key: ${OPENROUTER_API_KEY:}
      model-url: ${BREWLOG_OPENROUTER_MODEL_URL:https://openrouter.ai/api/v1/chat/completions}
      model-id: ${BREWLOG_OPENROUTER_MODEL_ID:google/gemma-4-31b-it:free}
      timeout-seconds: ${BREWLOG_OPENROUTER_TIMEOUT_SECONDS:60}
      max-tokens: ${BREWLOG_OPENROUTER_MAX_TOKENS:2048}
      reasoning-enabled: ${BREWLOG_OPENROUTER_REASONING_ENABLED:false}
      reasoning-effort: ${BREWLOG_OPENROUTER_REASONING_EFFORT:minimal}
      temperature: ${BREWLOG_OPENROUTER_TEMPERATURE:0.0}
      site-url: ${BREWLOG_OPENROUTER_SITE_URL:}
      app-name: ${BREWLOG_OPENROUTER_APP_NAME:BLANK}
    embedding:
      model-url: ${BREWLOG_EMBEDDING_MODEL_URL:https://openrouter.ai/api/v1/embeddings}
      model-id: ${BREWLOG_EMBEDDING_MODEL_ID:nvidia/nemotron-3-embed-1b:free}
      timeout-seconds: ${BREWLOG_EMBEDDING_TIMEOUT_SECONDS:90}
    ollama:
      model-url: ${BREWLOG_OLLAMA_MODEL_URL:http://127.0.0.1:11434/api/generate}
      model-id: ${BREWLOG_OLLAMA_MODEL_ID:gemma3:12b}
      timeout-seconds: ${BREWLOG_OLLAMA_TIMEOUT_SECONDS:120}
      num-predict: ${BREWLOG_OLLAMA_NUM_PREDICT:700}
      temperature: ${BREWLOG_OLLAMA_TEMPERATURE:0.0}
