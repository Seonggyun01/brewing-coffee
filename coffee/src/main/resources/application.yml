spring:
  application:
    name: coffee

  config:
    import: optional:classpath:application-local.yml

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:brewlog}?useUnicode=true&characterEncoding=utf8&serverTimezone=${DB_TIMEZONE:Asia/Seoul}&allowPublicKeyRetrieval=true&useSSL=false
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:brewlog}
    password: ${DB_PASSWORD:brewlog}

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: debug

brewlog:
  dummy-data:
    enabled: ${BREWLOG_DUMMY_DATA_ENABLED:false}
  ocr:
    provider: ${BREWLOG_OCR_PROVIDER:local-best}
    paddle:
      python-executable: ${BREWLOG_PADDLE_OCR_PYTHON:python3}
      script-path: ${BREWLOG_PADDLE_OCR_SCRIPT:scripts/paddle_ocr.py}
      cache-directory: ${BREWLOG_PADDLE_OCR_CACHE:${user.home}}
      timeout-seconds: ${BREWLOG_PADDLE_OCR_TIMEOUT_SECONDS:90}
      minimum-text-length: ${BREWLOG_PADDLE_OCR_MIN_TEXT_LENGTH:20}
      fallback-enabled: ${BREWLOG_PADDLE_OCR_FALLBACK_ENABLED:true}
      language: ${BREWLOG_PADDLE_OCR_LANG:korean}
      detection-model: ${BREWLOG_PADDLE_OCR_DETECTION_MODEL:PP-OCRv5_server_det}
      recognition-model: ${BREWLOG_PADDLE_OCR_RECOGNITION_MODEL:korean_PP-OCRv5_mobile_rec}
  llm:
    provider: ${BREWLOG_LLM_PROVIDER:ollama}
    ollama:
      model-url: ${BREWLOG_OLLAMA_MODEL_URL:http://127.0.0.1:11434/api/generate}
      model-id: ${BREWLOG_OLLAMA_MODEL_ID:gemma3:12b}
      timeout-seconds: ${BREWLOG_OLLAMA_TIMEOUT_SECONDS:120}
      num-predict: ${BREWLOG_OLLAMA_NUM_PREDICT:700}
      temperature: ${BREWLOG_OLLAMA_TEMPERATURE:0.0}
