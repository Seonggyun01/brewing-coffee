spring:
  application:
    name: coffee

  config:
    import: optional:classpath:application-local.yml

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:brewlog}?useUnicode=true&characterEncoding=utf8&serverTimezone=${DB_TIMEZONE:Asia/Seoul}&allowPublicKeyRetrieval=true&useSSL=false
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:brewlog}
    password: ${DB_PASSWORD:brewlog}

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: debug

brewlog:
  dummy-data:
    enabled: ${BREWLOG_DUMMY_DATA_ENABLED:false}
  ocr:
    provider: google-vision
