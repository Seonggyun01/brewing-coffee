<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카페 지도 - BrewLog</title>
    <link rel="stylesheet" th:href="@{/css/main.css(v='map-app-20260802')}">
    <link rel="stylesheet" th:href="@{/css/cafe-map.css(v=35)}">
</head>
<body class="cafe-map-page">
    <header th:replace="~{fragments/app-header :: appHeader('cafes')}"></header>

    <main class="cafe-map-shell">
        <section class="cafe-map-hero">
            <div>
                <p class="cafe-map-hero__eyebrow">Cafe Map</p>
                <h1>카페 지도</h1>
                <p>방문했거나 기록해둔 카페를 지도에서 확인해보세요.</p>
            </div>
            <a class="button button--secondary" th:href="@{/cafe-filter-coffees}">카페 필터 기록</a>
        </section>

        <section class="cafe-map-layout">
            <div class="cafe-map-card">
                <div id="cafeMap" class="cafe-map" aria-label="방문 카페 한국 지도">
                    <div class="cafe-map__actions">
                        <button class="cafe-map__control" type="button" data-map-reset>전체 지도</button>
                        <button class="cafe-map__control cafe-map__control--primary" type="button" data-visible-cafe-search>
                            이 화면에서 카페 찾기
                        </button>
                        <button class="cafe-map__control" type="button" data-visible-cafe-clear hidden>검색 지우기</button>
                    </div>
                    <p class="cafe-map__search-status" data-visible-cafe-status hidden></p>
                    <div class="cafe-map__canvas" data-kakao-cafe-map></div>
                    <div class="cafe-map__empty" data-cafe-map-status>
                        <strong>카페 지도를 준비하고 있어요.</strong>
                        <p th:text="${hasKakaoMapKey} ? '방문 카페 위치를 불러오는 중입니다.' : '카카오맵 JavaScript 키 설정이 필요합니다.'">
                            방문 카페 위치를 불러오는 중입니다.
                        </p>
                    </div>
                </div>
            </div>

            <aside class="cafe-map-panel">
                <div class="cafe-map-panel__header">
                    <div>
                        <span>방문 기록</span>
                        <h2>방문 카페</h2>
                    </div>
                    <strong data-cafe-count>0</strong>
                </div>
                <div class="cafe-map-panel__selected" data-selected-cafe>
                    <p>지도나 목록에서 카페를 선택하세요.</p>
                </div>
                <div class="cafe-map-list" data-cafe-list>
                    <p>카페 데이터를 불러오는 중입니다.</p>
                </div>
            </aside>
        </section>
    </main>

    <script th:if="${hasKakaoMapKey}"
            th:src="@{'https://dapi.kakao.com/v2/maps/sdk.js'(appkey=${kakaoJavascriptKey},libraries='services',autoload='false')}"></script>
    <script th:src="@{/js/cafe-map.js(v=32)}"></script>
</body>
</html>
