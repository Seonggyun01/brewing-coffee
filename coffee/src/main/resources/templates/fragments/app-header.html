<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<header class="app-header" th:fragment="appHeader(active)">
    <a class="app-header__brand" th:href="@{/}">
        <span class="app-header__logo">B</span>
        <strong>BrewLog</strong>
    </a>
    <nav class="app-header__nav" aria-label="주요 메뉴">
        <a th:href="@{/}" th:classappend="${active == 'home'} ? ' is-active'">Home</a>
        <a th:href="@{/coffee-beans}" th:classappend="${active == 'beans'} ? ' is-active'">Beans</a>
        <a th:href="@{/brew-records}" th:classappend="${active == 'records'} ? ' is-active'">Brew Records</a>
        <a th:href="@{/cafe-filter-coffees}" th:classappend="${active == 'cafe-filter'} ? ' is-active'">Cafe Filter</a>
        <a th:href="@{/cafes/map}" th:classappend="${active == 'cafes'} ? ' is-active'">Cafe Map</a>
    </nav>
    <div class="app-header__actions">
        <a class="button button--secondary" th:href="@{/cafe-filter-coffees/new}">카페 필터</a>
        <a class="button button--primary" th:href="@{/coffee-beans/new}">새 원두</a>
    </div>
    <nav class="app-bottom-nav" aria-label="하단 주요 메뉴">
        <a th:href="@{/}" th:classappend="${active == 'home'} ? ' is-active'">
            <span>홈</span>
        </a>
        <a th:href="@{/coffee-beans}" th:classappend="${active == 'beans'} ? ' is-active'">
            <span>원두</span>
        </a>
        <a th:href="@{/brew-records}" th:classappend="${active == 'records'} ? ' is-active'">
            <span>브루잉</span>
        </a>
        <a th:href="@{/cafe-filter-coffees}" th:classappend="${active == 'cafe-filter'} ? ' is-active'">
            <span>카페</span>
        </a>
        <a th:href="@{/cafes/map}" th:classappend="${active == 'cafes'} ? ' is-active'">
            <span>지도</span>
        </a>
    </nav>
</header>
</body>
</html>
