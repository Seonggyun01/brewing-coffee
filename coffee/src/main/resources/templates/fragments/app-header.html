<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<div class="app-shell-bars" th:fragment="appHeader(active)">
    <header class="app-header">
        <a class="app-header__brand" th:href="@{/}">
            <img class="app-header__logo" th:src="@{/img/blank-logo.svg(v='blank-20260825-2')}" alt="BLANK">
            <strong>BLANK</strong>
        </a>
        <span class="app-header__screen" th:switch="${active}" aria-hidden="true">
            <span th:case="'home'">홈</span>
            <span th:case="'beans'">원두</span>
            <span th:case="'records'">브루잉</span>
            <span th:case="'cafe-filter'">카페</span>
            <span th:case="'cafes'">지도</span>
            <span th:case="*">BLANK</span>
        </span>
        <nav class="app-header__nav" aria-label="주요 메뉴">
            <a th:href="@{/}" th:classappend="${active == 'home'} ? ' is-active'">홈</a>
            <a th:href="@{/coffee-beans}" th:classappend="${active == 'beans'} ? ' is-active'">원두</a>
            <a th:href="@{/brew-records}" th:classappend="${active == 'records'} ? ' is-active'">브루잉</a>
            <a th:href="@{/cafe-filter-coffees}" th:classappend="${active == 'cafe-filter'} ? ' is-active'">카페</a>
            <a th:href="@{/cafes/map}" th:classappend="${active == 'cafes'} ? ' is-active'">지도</a>
        </nav>
        <div class="app-header__actions">
            <span class="app-header__user" th:if="${signedInUser != null}" th:text="${signedInUser.nickname}">사용자</span>
            <form class="app-header__logout" th:if="${signedInUser != null}" th:action="@{/logout}" method="post">
                <button class="button button--ghost" type="submit">로그아웃</button>
            </form>
        </div>
    </header>
    <nav class="app-bottom-nav" aria-label="하단 주요 메뉴">
        <a th:href="@{/}" th:classappend="${active == 'home'} ? ' is-active'">
            <span>홈</span>
        </a>
        <a th:href="@{/coffee-beans}" th:classappend="${active == 'beans'} ? ' is-active'">
            <span>원두</span>
        </a>
        <a th:href="@{/brew-records}" th:classappend="${active == 'records'} ? ' is-active'">
            <span>브루잉</span>
        </a>
        <a th:href="@{/cafe-filter-coffees}" th:classappend="${active == 'cafe-filter'} ? ' is-active'">
            <span>카페</span>
        </a>
        <a th:href="@{/cafes/map}" th:classappend="${active == 'cafes'} ? ' is-active'">
            <span>지도</span>
        </a>
    </nav>
    <details class="app-fab" data-app-fab>
        <summary aria-label="빠른 추가 메뉴">+</summary>
        <div class="app-fab__menu" role="menu">
            <a th:href="@{/brew-records/new}" role="menuitem">브루잉 기록</a>
            <a th:href="@{/cafe-filter-coffees/new}" role="menuitem">카페 필터 기록</a>
            <a th:href="@{/coffee-beans/new}" role="menuitem">새 원두</a>
            <form th:if="${signedInUser != null}" th:action="@{/logout}" method="post">
                <button type="submit" role="menuitem">로그아웃</button>
            </form>
        </div>
    </details>
    <script th:src="@{/js/app-actions.js(v='app-fab-20260801-2')}"></script>
    <script th:src="@{/js/detail-modal.js(v='home-dashboard-20260802')}"></script>
</div>
</body>
</html>
