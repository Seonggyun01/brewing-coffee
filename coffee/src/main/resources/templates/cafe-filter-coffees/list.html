<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카페 필터커피 - BrewLog</title>
    <link rel="stylesheet" th:href="@{/css/main.css(v='cafe-filter-app-20260802-2')}">
</head>
<body>
    <header th:replace="~{fragments/app-header :: appHeader('cafe-filter')}"></header>
    <main class="page cafe-filter-page">
        <header class="page__header">
            <div>
                <a class="text-link" th:href="@{/}">BrewLog</a>
                <h1>카페 필터커피</h1>
            </div>
            <a class="button button--primary" th:href="@{/cafe-filter-coffees/new}">기록하기</a>
        </header>

        <p class="flash" th:if="${message}" th:text="${message}"></p>

        <form class="bean-search cafe-filter-search" th:action="@{/cafe-filter-coffees}" method="get" role="search">
            <input type="hidden" name="cafeId" th:if="${selectedCafeId != null}" th:value="${selectedCafeId}">
            <input type="search" name="q" th:value="${query}" placeholder="카페, 원두, 메모로 검색">
            <button class="button button--secondary" type="submit">검색</button>
            <a class="button button--ghost" th:href="@{/cafe-filter-coffees}" th:if="${selectedCafeId != null || (query != null && !#strings.isEmpty(query))}">초기화</a>
        </form>

        <section class="cafe-filter-toolbar" th:if="${!#lists.isEmpty(filterCafes)}" aria-label="카페 필터">
            <a th:href="@{/cafe-filter-coffees(q=${query})}"
               th:classappend="${selectedCafeId == null} ? ' is-active'">
                전체
            </a>
            <a th:each="cafe : ${filterCafes}"
               th:href="@{/cafe-filter-coffees(cafeId=${cafe.id},q=${query})}"
               th:classappend="${selectedCafeId != null && selectedCafeId == cafe.id} ? ' is-active'"
               th:text="${cafe.name}">
                카페
            </a>
        </section>

        <section class="cafe-filter-list" th:if="${!#lists.isEmpty(cafeFilterCoffees)}">
            <article class="cafe-filter-card" th:each="record : ${cafeFilterCoffees}">
                <a class="cafe-filter-card__link" th:href="@{/cafe-filter-coffees/{id}(id=${record.id})}">
                    <span class="flavor-gradient" th:style="${record.flavorGradientStyle}"></span>
                    <div class="cafe-filter-card__body">
                        <span th:text="${record.purchasePlaceName ?: '카페 미기록'}">카페</span>
                        <strong th:text="${record.coffeeBeanName}">에티오피아 구지</strong>
                        <div>
                            <small th:text="${record.brewedDate != null ? record.brewedDate : '날짜 미기록'}">2026-07-31</small>
                            <small th:text="${record.temperatureType != null ? record.temperatureType.displayName : '핫/아이스 미기록'}">핫</small>
                            <small th:text="${record.rating != null ? record.rating + '점' : '평점 없음'}">4점</small>
                        </div>
                        <p th:text="${record.memo != null && !#strings.isEmpty(record.memo) ? record.memo : record.flavorNoteSummary}">카페에서 마신 느낌</p>
                    </div>
                </a>
            </article>
        </section>

        <section class="empty-panel" th:if="${#lists.isEmpty(cafeFilterCoffees)}">
            <p th:text="${selectedCafeId != null ? '선택한 카페의 필터커피 기록이 없습니다.' : '카페에서 마신 필터커피 기록이 없습니다.'}">카페에서 마신 필터커피 기록이 없습니다.</p>
            <a class="button button--secondary" th:href="@{/cafe-filter-coffees/new}">첫 기록 남기기</a>
        </section>
    </main>
</body>
</html>
